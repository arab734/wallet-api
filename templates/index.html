<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список платежей</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>Список платежей</h1>
    <a href="/web/transactions/create">Совершить платёж</a>
    {% if transactions %}
        <ul>
            {% for transaction in transactions %}
            <li>
                <a href="/web/transactions/{{ transaction.id }}">{{ transaction.details }}</a> (ID: {{ transaction.id }})
            </li>
        {% endfor %}
        </ul>
    {% else %}
        <p>Платежей пока нет.</p>
    {% endif %}
</body>
</html>
